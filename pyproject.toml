[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
lint.ignore = [
    "B904",  # raise-without-from-inside-except
    "N802",  # function name should be lowercase (for DB column references)
    "N806",  # variable in function should be lowercase
    "TRY002",  # raising builtin exception types with messages is intentional here
    "TRY003",  # raising builtins with descriptive messages is idiomatic/intentional
]
lint.per-file-ignores = { "tests/**/*.py" = ["N802", "N806"], "conftest.py" = ["N802", "N806"] }

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "training/evaluation/tests"
]
python_files = "test_*.py"
