name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "*" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

env:
  CI_IMAGE: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest

jobs:
  check-changes:
    name: Check for dependency changes
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            any_changed:
              - '.github/workflows/build-env.yml'
              - '.github/ci.Dockerfile'
              - '**/pyproject.toml'
              - '**/poetry.lock'

  build-env:
    name: Build CI Environment
    needs: check-changes
    if: needs.check-changes.outputs.needs-build == 'true'
    uses: ./.github/workflows/build-env.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  quality:
    name: Quality (Linting & Type Checking)
    needs: build-env
    if: always() && (needs.build-env.result == 'success' || needs.build-env.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Dependencies are already in the Docker image!
      # Lint atlas + maia only. alkyone is intentionally unhooked from CI until
      # its test strategy is settled (see docs/agent-consolidation-proposal.md, P4).
      - name: Lint Modules (atlas + maia)
        run: make -C atlas lint && make -C maia lint

  unit-tests:
    name: Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Dependencies are already in the Docker image!
      - name: Run Unit Tests
        run: make test-unit

  # ── alkyone (integration tests) ───────────────────────────────────────────
  # Intentionally NOT run in CI. alkyone is the live integration/smoke suite
  # that, on a 24/7 VPS, would hit the production Postgres / YouTube quota /
  # HuggingFace vault. Its test strategy is being reworked (proposal P4) to use
  # an isolated test DB + test vault with a prod-URL guard before it is wired
  # back into CI. See docs/agent-consolidation-proposal.md.
