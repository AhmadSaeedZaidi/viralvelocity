name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  CI_IMAGE: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest

jobs:
  check-changes:
    name: Check for dependency changes
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            any_changed:
              - ".github/workflows/build-env.yml"
              - ".github/ci.Dockerfile"
              - "**/pyproject.toml"
              - "**/poetry.lock"

  build-env:
    name: Build CI Environment
    needs: check-changes
    if: needs.check-changes.outputs.needs-build == "true"
    uses: ./.github/workflows/build-env.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  quality:
    name: Quality (Linting & Type Checking)
    needs: build-env
    if: always() && (needs.build-env.result == "success" || needs.build-env.result == "skipped")
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dependencies are already in the Docker image.
      - name: Lint Modules (atlas + maia + alkyone)
        run: make -C atlas lint && make -C maia lint && make -C alkyone lint

  unit-tests:
    name: Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dependencies are already in the Docker image.
      - name: Run Unit Tests
        run: make test-unit

  # ── alkyone (integration tests) ───────────────────────────────────────────
  # Alkyone is NOT run per-PR. It exercises REAL infrastructure (test DB + test
  # vault) and must never burn production quota/data, so it runs on-demand via
  # `.github/workflows/alkyone.yml` (manual dispatch, prod-safety guarded).
  # It is linted above (make -C alkyone lint) so its code still stays green.
