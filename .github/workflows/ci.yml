name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  CI_IMAGE: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest

jobs:
  check-changes:
    name: Check for dependency changes
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            any_changed:
              - ".github/workflows/build-env.yml"
              - ".github/ci.Dockerfile"
              - "**/pyproject.toml"
              - "**/poetry.lock"

  ensure-image:
    name: Ensure CI image exists
    runs-on: ubuntu-latest
    outputs:
      image-ready: ${{ steps.check.outputs.exists }}
    steps:
      # Self-heal: a fresh clone has no ci-env image in GHCR yet. Detect that
      # and force build-env to build+push it so the container jobs below don't
      # fail pulling a non-existent image.
      - name: Check if base CI image exists in registry
        id: check
        env:
          IMAGE: ${{ env.CI_IMAGE }}
        run: |
          docker manifest inspect "$IMAGE" >/dev/null 2>&1 \
            && echo "exists=true" >> "$GITHUB_OUTPUT" \
            || echo "exists=false" >> "$GITHUB_OUTPUT"

  build-env:
    name: Build CI Environment
    needs: [check-changes, ensure-image]
    if: needs.check-changes.outputs.needs-build == "true" || needs.ensure-image.outputs.image-ready == "false"
    uses: ./.github/workflows/build-env.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  quality:
    name: Quality (Linting & Type Checking)
    needs: [build-env, ensure-image]
    if: always() && (needs.build-env.result == "success" || needs.build-env.result == "skipped")
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dependencies are already in the Docker image.
      - name: Lint Modules (atlas + maia + alkyone + mcp)
        run: make -C atlas lint && make -C maia lint && make -C alkyone lint && make -C mcp lint

  unit-tests:
    name: Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dependencies are already in the Docker image.
      - name: Run Unit Tests
        run: make test-unit

  # ── alkyone (integration tests) ───────────────────────────────────────────
  # Alkyone is NOT run per-PR. It exercises REAL infrastructure (test DB + test
  # vault) and must never burn production quota/data, so it runs on-demand via
  # `.github/workflows/alkyone.yml` (manual dispatch, prod-safety guarded).
  # It is linted above (make -C alkyone lint) so its code still stays green.
