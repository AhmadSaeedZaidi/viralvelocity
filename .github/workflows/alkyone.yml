name: Alkyone Integration

# Manual / scheduled real-infrastructure integration suite.
# Runs against an ISOLATED test DB + test vault only. A production-safety guard
# (alkyone/src/alkyone/guard.py) hard-refuses the run if DATABASE_URL /
# HF_DATASET_ID resolve to the production targets.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running integration tests?"
        required: false
        default: "manual"
  # Optional nightly run against the isolated test infra. Enable if desired.
  # schedule:
  #   - cron: "17 3 * * *"

concurrency:
  group: alkyone-integration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Alkyone Integration (isolated infra + prod guard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/ahmadsaeedzaidi/pleiades/ci-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # ── Isolated test infrastructure (repo Secrets — NEVER production) ──
      DATABASE_URL: ${{ secrets.ALKONE_TEST_DATABASE_URL }}
      HF_TOKEN: ${{ secrets.ALKONE_TEST_HF_TOKEN }}
      HF_DATASET_ID: ${{ secrets.ALKONE_TEST_VAULT }}
      HF_DATASET_ID_TEST: ${{ secrets.ALKONE_TEST_VAULT }}
      YOUTUBE_API_KEY_POOL_JSON: ${{ secrets.ALKONE_TEST_YOUTUBE_KEYS }}
      # ── Prod interlock: if these match the values above, Alkyone REFUSES ──
      PLEIADES_PROD_DATABASE_URL: ${{ secrets.PLEIADES_PROD_DATABASE_URL }}
      PLEIADES_PROD_VAULT: ${{ secrets.PLEIADES_PROD_VAULT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prod-safety guard
        run: make -C alkyone guard

      - name: Run integration tests
        run: make -C alkyone test-int
