name: Deploy (executor VPS)

# Deploys the Pleiades codebase to the executor VPS, where the Prefect worker
# runs the agent fleet from disk (see docs/micro-prefect-orchestration.md).
# On push to main (or manual dispatch) we SSH in, pull the latest code, install
# deps, re-apply orchestration, and restart the prefect-worker systemd service.
#
# Required GitHub secrets:
#   DEPLOY_HOST       - executor VPS hostname / IP
#   DEPLOY_USER       - SSH user
#   DEPLOY_SSH_KEY    - private key (ed25519/rsa) for that user
#   DEPLOY_PATH       - absolute path to the pleiades checkout on the VPS
#   WORKER_SERVICE    - systemd unit for the worker (default: prefect-worker)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print commands, no changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-executor
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  WORKER_SERVICE: ${{ secrets.WORKER_SERVICE }}

jobs:
  smoke:
    name: Preflight (CI status + code smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate deploy on the CI workflow (ci.yml). On direct pushes to main we
      # poll the check-runs for the 4 core CI jobs and fail fast unless all
      # completed successfully. Manual dispatches (workflow_dispatch) have no
      # upstream CI run for this SHA, so the gate is skipped for those.
      - name: Require CI to pass on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          JQPROG='.check_runs[] | select(.name=="Check for dependency changes" or .name=="Build CI Environment" or .name=="Quality (Linting & Type Checking)" or .name=="Unit Tests") | {name, status, conclusion}'
          echo "Waiting for CI to pass on $SHA ..."
          for i in $(seq 1 120); do
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq "$JQPROG" > /tmp/ci-runs.json
            if ! grep -q . /tmp/ci-runs.json; then
              echo "[$i] no CI runs yet; waiting..."
              sleep 15
              continue
            fi
            if jq -e 'select(.status != "completed")' /tmp/ci-runs.json > /dev/null; then
              echo "[$i] CI still running; waiting..."
              sleep 15
              continue
            fi
            if jq -e 'select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")' /tmp/ci-runs.json > /dev/null; then
              echo "CI did not pass:" >&2
              cat /tmp/ci-runs.json >&2
              exit 1
            fi
            echo "CI passed."
            exit 0
          done
          echo "Timed out waiting for CI to pass" >&2
          exit 1

      # Lightweight local smoke before deploy: compile our Python sources.
      - name: Code syntax smoke
        run: python3 -m compileall -q atlas maia alkyone mcp tools

  deploy:
    name: SSH deploy + restart prefect-worker
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (for reference)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            CDIR="${{ env.DEPLOY_PATH }}"
            SVCP="${{ env.WORKER_SERVICE }}"
            SVCP="${SVCP:-prefect-worker}"
            DRY="${{ github.event.inputs.dry_run }}"

            if [ -z "$CDIR" ]; then
              echo "DEPLOY_PATH secret is not set; aborting." >&2
              exit 1
            fi

            if [ "${DRY:-false}" = "true" ]; then
              echo "[dry-run] would: cd $CDIR && git pull --ff-only && poetry install && python tools/setup_orchestration.py && sudo systemctl restart $SVCP"
              exit 0
            fi

            cd "$CDIR"
            git pull --ff-only
            poetry install --no-interaction || make install
            python tools/setup_orchestration.py || true
            sudo systemctl restart "$SVCP"
            echo "deploy complete: $SVCP restarted from $CDIR"
